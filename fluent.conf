<system>
  log_level info
</system>

# Log forwarding from other hosts / Docker's fluentd log driver.
<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

# Handy for testing:
#   curl -X POST -d 'json={"message":"hello"}' http://localhost:9880/test.event
<source>
  @type http
  bind 0.0.0.0
  port 9880
</source>

# Fluentd's own health, so you can see the pipeline is alive.
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>

<match **>
  @type elasticsearch

  host   "#{ENV['ES_HOST']}"
  port   "#{ENV['ES_PORT']}"
  scheme https

  # Verify the stack's private CA rather than disabling verification.
  ssl_verify  true
  ca_file     "#{ENV['ES_CA']}"
  ssl_version TLSv1_2

  user     "#{ENV['ES_USER']}"
  password "#{ENV['ES_PASSWORD']}"

  # Index templates and ILM are owned by Terraform, so the plugin is told not
  # to manage them. The fluentd_writer role has auto_configure, which lets
  # dynamic mapping create the daily index until a template takes over.
  logstash_format true
  logstash_prefix ${tag}
  index_date_pattern "%Y.%m.%d"
  suppress_type_name true
  include_timestamp true

  # The plugin's version probe is brittle against newer majors; pin the API
  # dialect instead of letting it guess at startup.
  verify_es_version_at_startup false
  default_elasticsearch_version 8

  request_timeout 30s
  reload_connections false
  reconnect_on_error true
  reload_on_failure true

  <buffer tag>
    @type file
    path /fluentd/buffer/es
    flush_thread_count 2
    flush_interval 5s
    chunk_limit_size 8MB
    total_limit_size 1GB
    retry_forever true
    retry_max_interval 30
  </buffer>
</match>
